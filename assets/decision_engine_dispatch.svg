<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155" />
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .diagram-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .branch-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .container-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
    .firewall-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #b91c1c; letter-spacing: 0.5px; text-anchor: middle; }
    .firewall-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #b91c1c; text-anchor: middle; }
  </style>

  <rect width="900" height="620" fill="#ffffff" />

  <!-- Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" class="diagram-title">Runtime Dispatch: Body &amp; Voice</text>
    <text x="0" y="18" class="diagram-sub">How the engine handles an NPC turn — movement via schedule + A*, speech via prompt assembler + live API</text>
  </g>

  <!-- Input Node: NPC Turn -->
  <g transform="translate(290, 85)">
    <rect x="0" y="0" width="320" height="52" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="160" y="24" class="node-title">NPC Turn</text>
    <text x="160" y="40" class="node-sub">schedule waypoint due · player message received</text>
  </g>

  <!-- Central Routing Bar -->
  <line x1="450" y1="137" x2="450" y2="175" stroke="#334155" stroke-width="1.5" />
  <line x1="225" y1="175" x2="675" y2="175" stroke="#334155" stroke-width="1.5" />

  <!-- Drop Lines -->
  <line x1="225" y1="175" x2="225" y2="215" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="675" y1="175" x2="675" y2="215" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Branch Condition Labels -->
  <rect x="160" y="190" width="130" height="16" fill="#ffffff" />
  <text x="225" y="202" class="branch-label">MOVEMENT (BODY)</text>

  <rect x="610" y="190" width="130" height="16" fill="#ffffff" />
  <text x="675" y="202" class="branch-label">SPEECH (VOICE)</text>

  <!-- LEFT BRANCH: BODY -->
  <g transform="translate(105, 220)">
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="120" y="26" class="node-title">NPC Schedule (Body)</text>
    <text x="120" y="46" class="node-sub">next waypoint from world.json</text>
    <line x1="20" y1="56" x2="220" y2="56" stroke="#e2e8f0" stroke-width="1" />
    <text x="120" y="72" class="node-sub">a few stops per session</text>
  </g>

  <line x1="225" y1="300" x2="225" y2="335" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <g transform="translate(105, 340)">
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="120" y="26" class="node-title">A* Pathfinding</text>
    <text x="120" y="46" class="node-sub">shortest path on town graph</text>
    <line x1="20" y1="56" x2="220" y2="56" stroke="#e2e8f0" stroke-width="1" />
    <text x="120" y="72" class="node-sub">Euclidean heuristic · tile coords</text>
  </g>

  <!-- CENTER: SPOILER FIREWALL CALLOUT -->
  <g transform="translate(380, 235)">
    <rect x="0" y="0" width="140" height="144" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4,4" />
    <text x="70" y="24" class="firewall-title">SPOILER FIREWALL</text>
    <text x="70" y="48" class="firewall-text">truth.json never sent</text>
    <text x="70" y="62" class="firewall-text">to any API</text>
    <text x="70" y="80" class="firewall-text">no other NPC's files</text>
    <text x="70" y="94" class="firewall-text">own files only</text>
    <line x1="20" y1="106" x2="120" y2="106" stroke="#fecaca" stroke-width="1" />
    <text x="70" y="122" class="firewall-text">enforced by tests,</text>
    <text x="70" y="136" class="firewall-text">not prompt wording</text>
  </g>

  <!-- RIGHT BRANCH: VOICE -->
  <g transform="translate(555, 220)">
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="120" y="26" class="node-title">Prompt Assembler</text>
    <text x="120" y="46" class="node-sub">identity + memory + chat history</text>
    <line x1="20" y1="56" x2="220" y2="56" stroke="#e2e8f0" stroke-width="1" />
    <text x="120" y="72" class="node-sub">own files only · + player input</text>
  </g>

  <line x1="675" y1="300" x2="675" y2="335" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <g transform="translate(555, 340)">
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="120" y="26" class="node-title">Live API (Voice)</text>
    <text x="120" y="46" class="node-sub">≥2 providers · ≈2–3 s · streaming</text>
    <line x1="20" y1="56" x2="220" y2="56" stroke="#e2e8f0" stroke-width="1" />
    <text x="120" y="72" class="node-sub">token cap · canned fallback</text>
  </g>

  <!-- Re-convergence -->
  <line x1="225" y1="420" x2="225" y2="465" stroke="#334155" stroke-width="1.5" />
  <line x1="675" y1="420" x2="675" y2="465" stroke="#334155" stroke-width="1.5" />
  <line x1="225" y1="465" x2="675" y2="465" stroke="#334155" stroke-width="1.5" />
  <line x1="450" y1="465" x2="450" y2="505" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="375" y="473" width="150" height="16" fill="#ffffff" />
  <text x="450" y="485" class="branch-label">validated outcome</text>

  <!-- Result Node -->
  <g transform="translate(265, 510)">
    <rect x="0" y="0" width="370" height="56" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
    <text x="185" y="24" class="node-title">Engine Applies Result</text>
    <text x="185" y="40" class="node-sub">position · chat history · journal · clock</text>
    <text x="185" y="52" class="node-sub">bundle stays read-only (session state)</text>
  </g>
</svg>
