<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155" />
    </marker>
    <marker id="arrowLoop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#475569" />
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .diagram-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .formula-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: start; }
    .container-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #475569; text-anchor: middle; }
  </style>

  <rect width="900" height="660" fill="#ffffff" />

  <!-- Header -->
  <g transform="translate(60, 35)">
    <text x="0" y="0" class="diagram-title">Genetic Algorithm: Multi-Objective Route Planning</text>
    <text x="0" y="18" class="diagram-sub">Evolutionary workflow for optimizing candidate daily itineraries against multiple competing constraints</text>
  </g>

  <!-- 1. Chromosome Representation Box -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="780" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="24" class="container-title">1. CHROMOSOME REPRESENTATION (ORDERED WAYPOINTS)</text>
    
    <!-- Gene boxes -->
    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="130" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <text x="65" y="15" class="code-pill">Gene 1: Market</text>

      <line x1="135" y1="11" x2="150" y2="11" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="155" y="0" width="130" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <text x="220" y="15" class="code-pill">Gene 2: Alley</text>

      <line x1="290" y1="11" x2="305" y2="11" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="310" y="0" width="130" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <text x="375" y="15" class="code-pill">Gene 3: Library</text>

      <line x1="445" y1="11" x2="460" y2="11" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="465" y="0" width="130" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <text x="530" y="15" class="code-pill">Gene 4: Café</text>

      <line x1="600" y1="11" x2="615" y2="11" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="620" y="0" width="115" height="22" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1" />
      <text x="677" y="15" class="code-pill">Gene 5: Home</text>
    </g>
  </g>

  <!-- Edge: Chromosome -> Fitness -->
  <line x1="450" y1="145" x2="450" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. Fitness Evaluation Function Box -->
  <g transform="translate(60, 178)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="24" class="container-title">2. MULTI-OBJECTIVE FITNESS EVALUATION</text>
    <text x="24" y="44" class="formula-text">
      Fitness(Route) = - (w1 × Distance) - (w2 × DangerHazard) + (w3 × CluesGathered) + (w4 × PunctualityBonus)
    </text>
  </g>

  <!-- Edge: Fitness -> Evolutionary Cycle -->
  <line x1="450" y1="239" x2="450" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. Evolutionary Cycle Container -->
  <g transform="translate(60, 273)">
    <rect x="0" y="0" width="780" height="220" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <text x="18" y="22" class="container-title">3. EVOLUTIONARY RECURSION (50 GENERATIONS)</text>

    <!-- Stage A: Initial Population -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="130" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
      <text x="65" y="26" class="node-title">Population</text>
      <text x="65" y="42" class="node-sub">Initialization</text>
      <line x1="15" y1="52" x2="115" y2="52" stroke="#e2e8f0" stroke-width="1" />
      <text x="65" y="74" class="node-sub">50 candidate</text>
      <text x="65" y="90" class="node-sub">routes created</text>
      <text x="65" y="106" class="node-sub">at random</text>
    </g>

    <line x1="155" y1="105" x2="175" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Stage B: Selection -->
    <g transform="translate(180, 40)">
      <rect x="0" y="0" width="130" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
      <text x="65" y="26" class="node-title">Tournament</text>
      <text x="65" y="42" class="node-sub">Selection</text>
      <line x1="15" y1="52" x2="115" y2="52" stroke="#e2e8f0" stroke-width="1" />
      <text x="65" y="74" class="node-sub">Groups of 3</text>
      <text x="65" y="90" class="node-sub">Fittest routes</text>
      <text x="65" y="106" class="node-sub">chosen as parents</text>
    </g>

    <line x1="315" y1="105" x2="335" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Stage C: Crossover -->
    <g transform="translate(340, 40)">
      <rect x="0" y="0" width="130" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
      <text x="65" y="26" class="node-title">Order Crossover</text>
      <text x="65" y="42" class="node-sub">(OX Operator)</text>
      <line x1="15" y1="52" x2="115" y2="52" stroke="#e2e8f0" stroke-width="1" />
      <text x="65" y="74" class="node-sub">Blends route</text>
      <text x="65" y="90" class="node-sub">sub-segments</text>
      <text x="65" y="106" class="node-sub">Rate = 0.80</text>
    </g>

    <line x1="475" y1="105" x2="495" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Stage D: Mutation -->
    <g transform="translate(500, 40)">
      <rect x="0" y="0" width="125" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
      <text x="62" y="26" class="node-title">Mutation</text>
      <text x="62" y="42" class="node-sub">Swap Operator</text>
      <line x1="15" y1="52" x2="110" y2="52" stroke="#e2e8f0" stroke-width="1" />
      <text x="62" y="74" class="node-sub">Swaps 2 nodes</text>
      <text x="62" y="90" class="node-sub">Explores detours</text>
      <text x="62" y="106" class="node-sub">Rate = 0.05</text>
    </g>

    <line x1="630" y1="105" x2="650" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Stage E: Elitism -->
    <g transform="translate(655, 40)">
      <rect x="0" y="0" width="105" height="130" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.2" />
      <text x="52" y="26" class="node-title">Elitism</text>
      <text x="52" y="42" class="node-sub">Next Gen</text>
      <line x1="10" y1="52" x2="95" y2="52" stroke="#e2e8f0" stroke-width="1" />
      <text x="52" y="74" class="node-sub">Top 5%</text>
      <text x="52" y="90" class="node-sub">survive</text>
      <text x="52" y="106" class="node-sub">untouched</text>
    </g>

    <!-- Generation Loop Arrow back -->
    <path d="M 707 175 L 707 195 L 85 195 L 85 175" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowLoop)" />
    <rect x="345" y="185" width="130" height="16" fill="#ffffff" />
    <text x="410" y="197" class="edge-label">next generation loop</text>
  </g>

  <!-- Edge: GA Loop -> Output -->
  <line x1="450" y1="495" x2="450" y2="535" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="365" y="505" width="170" height="18" fill="#ffffff" />
  <text x="450" y="518" class="edge-label">terminates at 50 generations</text>

  <!-- 4. Optimal Plan Output -->
  <g transform="translate(260, 540)">
    <rect x="0" y="0" width="380" height="56" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
    <text x="190" y="24" class="node-title">Optimized Daily Itinerary Dispatched</text>
    <text x="190" y="42" class="node-sub">Handed to NPC movement controller for physical graph execution</text>
  </g>
</svg>