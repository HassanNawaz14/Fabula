<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <!-- Crisp Arrowhead Marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155" />
    </marker>
    <marker id="arrowLoop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#475569" />
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .diagram-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .sub-node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .sub-node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #475569; text-anchor: middle; }
    .container-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="700" fill="#ffffff" />

  <!-- Title Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" class="diagram-title">System Architecture: NPC Simulation Loop</text>
    <text x="0" y="18" class="diagram-sub">Perception-Decision-Action cycle in a dynamic multi-agent environment</text>
  </g>

  <!-- 1. World State -->
  <g transform="translate(290, 85)">
    <rect x="0" y="0" width="320" height="56" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="160" y="26" class="node-title">World State</text>
    <text x="160" y="44" class="node-sub">Town graph, item locations, NPC coordinates, time</text>
  </g>

  <!-- Edge: World State -> Perception -->
  <line x1="450" y1="141" x2="450" y2="183" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="390" y="152" width="120" height="18" fill="#ffffff" />
  <text x="450" y="165" class="edge-label">local observation</text>

  <!-- 2. Perception Filter -->
  <g transform="translate(290, 185)">
    <rect x="0" y="0" width="320" height="54" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="160" y="25" class="node-title">Perception Filter</text>
    <text x="160" y="43" class="node-sub">Sensory limits, sight radius, audible events</text>
  </g>

  <!-- Edge: Perception -> NPC Internal State -->
  <line x1="450" y1="239" x2="450" y2="283" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="390" y="251" width="120" height="18" fill="#ffffff" />
  <text x="450" y="264" class="edge-label">records events</text>

  <!-- 3. Internal State Container: Memory & Goals -->
  <g transform="translate(190, 285)">
    <!-- Container Outline -->
    <rect x="0" y="0" width="520" height="85" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <text x="16" y="20" class="container-title">NPC INTERNAL STATE</text>

    <!-- Memory Log -->
    <g transform="translate(20, 28)">
      <rect x="0" y="0" width="230" height="46" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" />
      <text x="115" y="20" class="sub-node-title">Memory Log</text>
      <text x="115" y="36" class="sub-node-sub">Observed events &amp; conversation history</text>
    </g>

    <!-- Goals & Personality -->
    <g transform="translate(270, 28)">
      <rect x="0" y="0" width="230" height="46" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" />
      <text x="115" y="20" class="sub-node-title">Goals &amp; Personality</text>
      <text x="115" y="36" class="sub-node-sub">Active desires, priorities, character traits</text>
    </g>
  </g>

  <!-- Edge: Internal State -> Decision Engine -->
  <line x1="450" y1="370" x2="450" y2="408" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="385" y="380" width="130" height="18" fill="#ffffff" />
  <text x="450" y="393" class="edge-label">retrieves context</text>

  <!-- 4. Decision Engine Container -->
  <g transform="translate(140, 410)">
    <rect x="0" y="0" width="620" height="110" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="18" y="22" class="container-title">DECISION ENGINE (ACTION &amp; DIALOGUE SELECTION)</text>

    <!-- Sub-component 1: Search -->
    <g transform="translate(18, 35)">
      <rect x="0" y="0" width="135" height="58" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1" />
      <text x="67" y="24" class="sub-node-title">Search &amp; Planning</text>
      <text x="67" y="42" class="sub-node-sub">A* / BFS</text>
      <text x="67" y="52" class="sub-node-sub">Pathfinding</text>
    </g>

    <!-- Sub-component 2: Genetic Algorithm -->
    <g transform="translate(163, 35)">
      <rect x="0" y="0" width="140" height="58" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1" />
      <text x="70" y="24" class="sub-node-title">Genetic Algorithm</text>
      <text x="70" y="42" class="sub-node-sub">Multi-objective</text>
      <text x="70" y="52" class="sub-node-sub">Plan optimization</text>
    </g>

    <!-- Sub-component 3: Neural Network & Clustering -->
    <g transform="translate(313, 35)">
      <rect x="0" y="0" width="140" height="58" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1" />
      <text x="70" y="24" class="sub-node-title">Neural Network</text>
      <text x="70" y="42" class="sub-node-sub">MLP policy classifier</text>
      <text x="70" y="52" class="sub-node-sub">&amp; behavior clusters</text>
    </g>

    <!-- Sub-component 4: LLM Dialogue -->
    <g transform="translate(463, 35)">
      <rect x="0" y="0" width="140" height="58" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1" />
      <text x="70" y="24" class="sub-node-title">LLM Dialogue</text>
      <text x="70" y="42" class="sub-node-sub">Natural language</text>
      <text x="70" y="52" class="sub-node-sub">&amp; verbal reasoning</text>
    </g>
  </g>

  <!-- Edge: Decision Engine -> Action Execution -->
  <line x1="450" y1="520" x2="450" y2="558" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="390" y="530" width="120" height="18" fill="#ffffff" />
  <text x="450" y="543" class="edge-label">selects action</text>

  <!-- 5. Action Execution -->
  <g transform="translate(290, 560)">
    <rect x="0" y="0" width="320" height="54" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="160" y="25" class="node-title">Action Execution</text>
    <text x="160" y="43" class="node-sub">Move, Talk, Examine, Pick Up, Wait</text>
  </g>

  <!-- Feedback Loop: Action Execution -> World State -->
  <path d="M 290 587 L 90 587 L 90 113 L 282 113" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowLoop)" />
  <rect x="40" y="335" width="100" height="30" fill="#ffffff" />
  <text x="90" y="347" class="edge-label">updates state</text>
  <text x="90" y="361" class="edge-label">&amp; advances time</text>
</svg>