<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <!-- Crisp Arrowhead Marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155" />
    </marker>
    <marker id="arrowLoop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#475569" />
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .diagram-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .sub-node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .sub-node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #475569; text-anchor: middle; }
    .container-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="900" fill="#ffffff" />

  <!-- Title Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" class="diagram-title">System Architecture: Generation &amp; Play</text>
    <text x="0" y="18" class="diagram-sub">Phase 1: local staged generation → validated JSON bundle · Phase 2: headless play with Body (A*) and Voice (live API)</text>
  </g>

  <!-- ============ PHASE 1: GENERATION ============ -->
  <g transform="translate(60, 88)">
    <rect x="0" y="0" width="780" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <text x="18" y="20" class="container-title">PHASE 1 — GENERATION (local, before play)</text>

    <!-- Step 1: Player Settings -->
    <g transform="translate(11, 30)">
      <rect x="0" y="0" width="170" height="76" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <text x="85" y="26" class="node-title">Player Settings</text>
      <text x="85" y="48" class="node-sub">mystery_type · tone</text>
      <text x="85" y="64" class="node-sub">difficulty (or random)</text>
    </g>

    <line x1="181" y1="68" x2="203" y2="68" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Step 2: Fine-tuned LLM (staged) -->
    <g transform="translate(207, 30)">
      <rect x="0" y="0" width="170" height="76" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <text x="85" y="24" class="node-title">Fine-tuned ~3–4B LLM</text>
      <text x="85" y="44" class="node-sub">world → cast → truth</text>
      <text x="85" y="58" class="node-sub">→ per-NPC files</text>
      <text x="85" y="72" class="node-sub">constrained JSON decoding</text>
    </g>

    <line x1="377" y1="68" x2="399" y2="68" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Step 3: Validator + Retry -->
    <g transform="translate(403, 30)">
      <rect x="0" y="0" width="170" height="76" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <text x="85" y="24" class="node-title">Validator + Retry</text>
      <text x="85" y="44" class="node-sub">schema · cross-refs</text>
      <text x="85" y="58" class="node-sub">solvability · timeline</text>
      <text x="85" y="72" class="node-sub">fail → retry (max 3)</text>
    </g>

    <line x1="573" y1="68" x2="595" y2="68" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Step 4: Game Bundle -->
    <g transform="translate(599, 30)">
      <rect x="0" y="0" width="170" height="76" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
      <text x="85" y="24" class="node-title">Game Bundle (JSON)</text>
      <text x="85" y="44" class="node-sub">world · truth · clues</text>
      <text x="85" y="58" class="node-sub">npcs/&lt;id&gt;/identity</text>
      <text x="85" y="72" class="node-sub">npcs/&lt;id&gt;/memory</text>
    </g>
  </g>

  <!-- ============ PHASE 2: PLAY (container drawn first so the connector stays on top) ============ -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="780" height="630" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <text x="18" y="22" class="container-title">PHASE 2 — PLAY (headless engine, ~10 minutes)</text>
  </g>

  <!-- Bundle → Engine connector -->
  <path d="M 744 194 V 258 H 450 V 285" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="520" y="250" width="170" height="16" fill="#ffffff" />
  <text x="605" y="262" class="edge-label">loads bundle (read-only)</text>

  <!-- 1. World State -->
  <g transform="translate(290, 285)">
    <rect x="0" y="0" width="320" height="62" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="160" y="25" class="node-title">World State (engine)</text>
    <text x="160" y="43" class="node-sub">town graph · NPC &amp; clue tiles · session clock</text>
    <text x="160" y="56" class="node-sub">truth.json stays engine-only</text>
  </g>

  <line x1="450" y1="347" x2="450" y2="395" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="390" y="353" width="120" height="16" fill="#ffffff" />
  <text x="450" y="365" class="edge-label">perceived events</text>

  <!-- 2. Perception Filter -->
  <g transform="translate(290, 397)">
    <rect x="0" y="0" width="320" height="54" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="160" y="24" class="node-title">Perception Filter</text>
    <text x="160" y="42" class="node-sub">own location (optionally adjacent)</text>
  </g>

  <line x1="450" y1="451" x2="450" y2="499" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="390" y="457" width="120" height="16" fill="#ffffff" />
  <text x="450" y="469" class="edge-label">session facts</text>

  <!-- 3. NPC Internal State Container -->
  <g transform="translate(180, 501)">
    <rect x="0" y="0" width="540" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <text x="16" y="20" class="container-title">NPC INTERNAL STATE (OWN FILES ONLY)</text>

    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="160" height="50" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" />
      <text x="80" y="20" class="sub-node-title">identity.json</text>
      <text x="80" y="37" class="sub-node-sub">persona · traits · goals</text>
    </g>

    <g transform="translate(190, 30)">
      <rect x="0" y="0" width="160" height="50" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" />
      <text x="80" y="20" class="sub-node-title">memory.json</text>
      <text x="80" y="37" class="sub-node-sub">facts · disclosure policy</text>
    </g>

    <g transform="translate(365, 30)">
      <rect x="0" y="0" width="160" height="50" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" />
      <text x="80" y="20" class="sub-node-title">Session State</text>
      <text x="80" y="37" class="sub-node-sub">chat history · in-session facts</text>
    </g>
  </g>

  <line x1="450" y1="591" x2="450" y2="639" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="365" y="597" width="170" height="16" fill="#ffffff" />
  <text x="450" y="609" class="edge-label">context: own files only</text>

  <!-- 4. Decision & Communication (Body / Voice) -->
  <g transform="translate(140, 641)">
    <rect x="0" y="0" width="620" height="110" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="18" y="22" class="container-title">NPC DECISION &amp; COMMUNICATION</text>

    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="280" height="62" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1" />
      <text x="140" y="22" class="sub-node-title">Body: Schedule + A*</text>
      <text x="140" y="40" class="sub-node-sub">next waypoint from world.json</text>
      <text x="140" y="54" class="sub-node-sub">A* shortest path (Euclidean)</text>
    </g>

    <g transform="translate(320, 35)">
      <rect x="0" y="0" width="280" height="62" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1" />
      <text x="140" y="22" class="sub-node-title">Voice: Prompt → Live API</text>
      <text x="140" y="40" class="sub-node-sub">identity + memory + chat history</text>
      <text x="140" y="54" class="sub-node-sub">reply {reply, mood} · fallback lines</text>
    </g>
  </g>

  <line x1="450" y1="751" x2="450" y2="799" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="385" y="757" width="130" height="16" fill="#ffffff" />
  <text x="450" y="769" class="edge-label">action · reply</text>

  <!-- 5. Execution, Journal & Timer -->
  <g transform="translate(290, 801)">
    <rect x="0" y="0" width="320" height="58" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="160" y="24" class="node-title">Execution, Journal &amp; Timer</text>
    <text x="160" y="41" class="node-sub">move · record clue · countdown</text>
    <text x="160" y="53" class="node-sub">accusation: who / how / why</text>
  </g>

  <!-- Feedback Loop: Execution -> World State -->
  <path d="M 290 830 L 100 830 L 100 316 L 282 316" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowLoop)" />
  <rect x="40" y="556" width="120" height="34" fill="#ffffff" />
  <text x="100" y="570" class="edge-label">updates state</text>
  <text x="100" y="584" class="edge-label">&amp; advances clock</text>
</svg>
