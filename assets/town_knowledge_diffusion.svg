<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155" />
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; text-anchor: start; }
    .diagram-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; text-anchor: start; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .node-title-red { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .section-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; text-anchor: start; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: start; }
    .card-line { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: start; }
    .status-true { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; text-anchor: start; }
    .status-partial { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0f766e; text-anchor: start; }
    .status-neutral { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; text-anchor: start; }
    .blocked-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
    .footnote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; text-anchor: start; }
  </style>

  <rect width="900" height="640" fill="#ffffff" />

  <!-- Header -->
  <g transform="translate(60, 35)">
    <text x="0" y="0" class="diagram-title">Knowledge Isolation &amp; Spoiler Firewall</text>
    <text x="0" y="18" class="diagram-sub">Each NPC is authored to know only its own facts; truth.json stays engine-only and never enters a prompt</text>
  </g>

  <!-- ============ PART 1: PER-NPC KNOWLEDGE ============ -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="780" height="175" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <text x="18" y="24" class="section-label">PART 1: PER-NPC KNOWLEDGE (authored at generation time)</text>

    <!-- Card A: Culprit -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="240" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" class="card-title">Ravi — Culprit</text>
      <line x1="12" y1="32" x2="228" y2="32" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="50" class="status-true">knows the TRUE account</text>
      <text x="14" y="68" class="card-line">did: took the locket (hide)</text>
      <text x="14" y="84" class="card-line">cover story: “at the docks” (lie)</text>
      <text x="14" y="100" class="card-line">only holder of the full truth</text>
    </g>

    <!-- Card B: Witness -->
    <g transform="translate(270, 45)">
      <rect x="0" y="0" width="240" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" class="card-title">Mira — Witness</text>
      <line x1="12" y1="32" x2="228" y2="32" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="50" class="status-partial">partial observation only</text>
      <text x="14" y="68" class="card-line">witnessed: locket snatched</text>
      <text x="14" y="84" class="card-line">disclosure: if_asked</text>
      <text x="14" y="100" class="card-line">never names a culprit unseen</text>
    </g>

    <!-- Card C: Red herring -->
    <g transform="translate(525, 45)">
      <rect x="0" y="0" width="240" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" class="card-title">Tomas — Red herring</text>
      <line x1="12" y1="32" x2="228" y2="32" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="50" class="status-neutral">unrelated secret</text>
      <text x="14" y="68" class="card-line">own secret (hide)</text>
      <text x="14" y="84" class="card-line">suspicion without answers</text>
      <text x="14" y="100" class="card-line">keeps the case ambiguous</text>
    </g>
  </g>

  <!-- ============ PART 2: RUNTIME FIREWALL ============ -->
  <g transform="translate(60, 285)">
    <rect x="0" y="0" width="780" height="310" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <text x="18" y="24" class="section-label">PART 2: RUNTIME PROMPT ASSEMBLY (spoiler firewall)</text>

    <!-- Flow step 1: Own files -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="175" height="70" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <text x="87" y="26" class="node-title">Own Files Only</text>
      <text x="87" y="46" class="node-sub">identity.json + memory.json</text>
      <text x="87" y="60" class="node-sub">own chat history</text>
    </g>

    <line x1="195" y1="83" x2="225" y2="83" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Flow step 2: Prompt assembler -->
    <g transform="translate(230, 48)">
      <rect x="0" y="0" width="175" height="70" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <text x="87" y="26" class="node-title">Prompt Assembler</text>
      <text x="87" y="46" class="node-sub">disclosure policies applied</text>
      <text x="87" y="60" class="node-sub">player input appended</text>
    </g>

    <line x1="405" y1="83" x2="430" y2="83" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Flow step 3: Live API -->
    <g transform="translate(435, 48)">
      <rect x="0" y="0" width="165" height="70" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <text x="82" y="26" class="node-title">Live API</text>
      <text x="82" y="46" class="node-sub">≥2 providers · ≈2–3 s</text>
      <text x="82" y="60" class="node-sub">no local chat model</text>
    </g>

    <line x1="600" y1="83" x2="625" y2="83" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Flow step 4: Reply -->
    <g transform="translate(630, 48)">
      <rect x="0" y="0" width="130" height="70" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
      <text x="65" y="26" class="node-title">In-Character</text>
      <text x="65" y="46" class="node-sub">{reply, mood}</text>
      <text x="65" y="60" class="node-sub">bounded by own facts</text>
    </g>

    <!-- truth.json: ENGINE ONLY (blocked) -->
    <g transform="translate(230, 175)">
      <rect x="0" y="0" width="175" height="70" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" />
      <text x="87" y="24" class="node-title-red">truth.json</text>
      <text x="87" y="40" class="node-sub">ENGINE ONLY</text>
      <text x="87" y="52" class="node-sub">never in a prompt or API call</text>
      <text x="87" y="64" class="node-sub">culprit · timeline · solution</text>
    </g>

    <!-- Blocked arrow -->
    <line x1="317" y1="175" x2="317" y2="122" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3" />
    <line x1="308" y1="141" x2="326" y2="159" stroke="#b91c1c" stroke-width="2.2" />
    <line x1="326" y1="141" x2="308" y2="159" stroke="#b91c1c" stroke-width="2.2" />

    <!-- Blocked label -->
    <text x="122" y="150" class="blocked-label">BLOCKED: never enters</text>
    <text x="122" y="164" class="blocked-label">a prompt or API call</text>

    <!-- Footnote -->
    <text x="20" y="285" class="footnote">Session facts (what the player tells an NPC) are added per NPC; the shipped bundle stays read-only.</text>
  </g>
</svg>
